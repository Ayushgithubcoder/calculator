services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
    - FLASK_ENV=development
    - PYTHONUNBUFFERED=1
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5000/health || exit 1
      timeout: 10s
    ports:
    - ${BACKEND_PORT:-5000}:5000
    volumes:
    - ./backend:/app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
    - backend
    environment:
    - NODE_ENV=development
    - CHOKIDAR_USEPOLLING=true
    - WATCHPACK_POLLING=true
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000 || exit 1
      timeout: 10s
    ports:
    - ${FRONTEND_PORT:-3000}:3000
    volumes:
    - ./frontend:/app
    - /app/node_modules
version: '3.8'
